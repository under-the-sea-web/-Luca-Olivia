<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Under The Sea | Luca & Olivia</title>

  <meta
    name="description"
    content="Under The Sea - Luca & Olivia"
  >

  <meta name="theme-color" content="#b9e4ef">


  <!-- ========================================
       PORTADA DEL LINK EN WHATSAPP
       CAMBIAR ESTAS URL DESPUÉS DE PUBLICAR
       ======================================== -->

  <meta
    property="og:title"
    content="Under The Sea | Luca & Olivia"
  >

  <meta
    property="og:description"
    content="Te esperamos para celebrar con nosotros."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://TU-USUARIO.github.io/under-the-sea/"
  >

  <meta
    property="og:image"
    content="https://TU-USUARIO.github.io/under-the-sea/portada-link.jpg"
  >

  <meta
    property="og:image:width"
    content="1024"
  >

  <meta
    property="og:image:height"
    content="1536"
  >


  <style>

    /* ==============================
       CONFIGURACIÓN GENERAL
       ============================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #bce5ef;
    }

    body {
      margin: 0;
      overflow-x: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #faf4ee;
    }

    img {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }


    /* ==============================
       PANTALLA 1
       OCÉANO
       ============================== */

    .ocean-cover {

      position: relative;

      width: 100%;
      height: 100svh;

      min-height: 600px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background-image:
        url("fondo-oceano.jpg");

      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;

    }


    /* filtro muy suave */

    .ocean-cover::after {

      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,.05),
          rgba(134,211,231,.06)
        );

      pointer-events: none;
    }


    /* ==============================
       UNDER THE SEA
       ============================== */

    .ocean-center {

      position: relative;

      z-index: 10;

      display: flex;
      flex-direction: column;
      align-items: center;

      transform: translateY(3vh);

      color: white;

      text-align: center;

    }


    .ocean-title {

      font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size:
        clamp(
          20px,
          4.2vw,
          34px
        );

      font-weight: 300;

      letter-spacing:
        clamp(
          7px,
          2vw,
          15px
        );

      color: rgba(255,255,255,.96);

      text-shadow:
        0 2px 10px
        rgba(62,130,160,.15);

      margin-left: .5em;

    }


    .ocean-wave {

      font-size: 38px;

      font-weight: 200;

      line-height: 1;

      margin-top: 18px;

      color:
        rgba(255,255,255,.93);

      animation:
        waveFloat
        3s
        ease-in-out
        infinite;

    }


    @keyframes waveFloat {

      0%,
      100% {
        transform: translateX(-3px);
      }

      50% {
        transform: translateX(3px);
      }

    }


    /* ==============================
       FLECHA
       ============================== */

    .scroll-button {

      margin-top: 32px;

      width: 54px;
      height: 54px;

      display: flex;
      justify-content: center;
      align-items: center;

      border: 1px solid
        rgba(255,255,255,.8);

      border-radius: 50%;

      background:
        rgba(255,255,255,.17);

      backdrop-filter:
        blur(6px);

      -webkit-backdrop-filter:
        blur(6px);

      color: white;

      cursor: pointer;

      font-size: 28px;

      font-weight: 200;

      box-shadow:
        0 6px 25px
        rgba(59,121,150,.12);

      animation:
        arrowMove
        2s
        ease-in-out
        infinite;

    }


    @keyframes arrowMove {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(9px);
      }

    }


    /* ==============================
       BURBUJAS
       ============================== */

    .bubble {

      position: absolute;

      bottom: -100px;

      width: var(--size);
      height: var(--size);

      left: var(--left);

      z-index: 6;

      border-radius: 50%;

      pointer-events: none;

      opacity: 0;

      border:
        1px solid
        rgba(255,255,255,.7);

      background:
        radial-gradient(
          circle at 32% 28%,
          rgba(255,255,255,.92),
          rgba(255,255,255,.22) 28%,
          rgba(183,223,240,.15) 58%,
          rgba(255,255,255,.35)
        );

      box-shadow:
        inset
        1px
        1px
        7px
        rgba(255,255,255,.8);

      animation:
        riseBubble
        var(--duration)
        linear
        var(--delay)
        infinite;

    }


    @keyframes riseBubble {

      0% {

        opacity: 0;

        transform:
          translate3d(
            0,
            0,
            0
          )
          scale(.75);

      }

      10% {
        opacity: .55;
      }

      50% {

        transform:
          translate3d(
            var(--drift),
            -55vh,
            0
          )
          scale(1);

      }

      90% {
        opacity: .4;
      }

      100% {

        opacity: 0;

        transform:
          translate3d(
            calc(
              var(--drift) * -0.3
            ),
            -115vh,
            0
          )
          scale(1.08);

      }

    }



    /* ========================================
       SEGUNDA PANTALLA
       ======================================== */

    .invitation-section {

      position: relative;

      width: 100%;

      min-height: 100svh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          #fffaf5 0%,
          #fcf3eb 100%
        );

    }


    /* ==============================
       TARJETA
       ============================== */

    .invitation {

      position: relative;

      width:
        min(
          100vw,
          760px
        );

      aspect-ratio: 2 / 3;

      min-height: 580px;

      overflow: hidden;

      isolation: isolate;

      background:
        linear-gradient(
          145deg,
          #fffaf5,
          #faf1e9
        );

    }


    /* textura perla */

    .invitation::before {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 0;

      pointer-events: none;

      opacity: .18;

      background-image:

        radial-gradient(
          circle at 30% 20%,
          white 0,
          transparent 35%
        ),

        radial-gradient(
          circle at 75% 65%,
          #f7dfe2 0,
          transparent 40%
        );

    }



    /* ==============================
       PIRATA
       ============================== */

    .pirate-wrapper {

      position: absolute;

      z-index: 1;

      left: -12%;

      bottom: -1%;

      width: 64%;

      transform-origin:
        47%
        70%;

      animation:
        pirateRock
        6s
        ease-in-out
        infinite;

      pointer-events: none;

    }


    .pirate {

      width: 100%;

      filter:
        drop-shadow(
          0 7px 4px
          rgba(110,88,70,.05)
        );

    }


    @keyframes pirateRock {

      0%,
      100% {

        transform:
          translateY(0)
          rotate(-.45deg);

      }

      50% {

        transform:
          translateY(-7px)
          rotate(.8deg);

      }

    }



    /* ==============================
       SIRENA
       ============================== */

    .mermaid-wrapper {

      position: absolute;

      z-index: 1;

      right: -12%;

      bottom: -1%;

      width: 63%;

      transform-origin:
        57%
        72%;

      animation:
        mermaidMove
        6.5s
        ease-in-out
        infinite;

      pointer-events: none;

    }


    .mermaid {

      width: 100%;

      filter:
        drop-shadow(
          0 7px 4px
          rgba(170,119,145,.04)
        );

    }


    @keyframes mermaidMove {

      0%,
      100% {

        transform:
          translateY(2px)
          rotate(.25deg)
          skewX(0deg);

      }

      50% {

        transform:
          translateY(-5px)
          rotate(-.45deg)
          skewX(.6deg);

      }

    }



    /* ==============================
       INFORMACIÓN CENTRAL

       Toda la información de nombres,
       fecha, hora, lugar y botones
       viene en esta imagen.
       ============================== */

    .information-layer {

      position: absolute;

      z-index: 5;

      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      pointer-events: none;

    }


    .information-layer img {

      width: 100%;
      height: 100%;

      object-fit: contain;

    }



    /* ==============================
       ZONAS CLICABLES
       ============================== */

    .click-area {

      position: absolute;

      z-index: 20;

      display: block;

      cursor: pointer;

      background:
        rgba(255,255,255,0);

      border: none;

      text-decoration: none;

      -webkit-tap-highlight-color:
        transparent;

    }


    /* PLAZA TRIBECA / LUGAR */

    .map-area {

      left: 25%;

      top: 78%;

      width: 50%;

      height: 8%;

    }


    /* CONFIRMAR */

    .confirm-area {

      left: 4.5%;

      top: 88.1%;

      width: 47%;

      height: 8%;

      border-radius: 100px;

    }


    /* PREGUNTAS */

    .questions-area {

      right: 4.5%;

      top: 88.1%;

      width: 42%;

      height: 8%;

      border-radius: 100px;

    }


    /* efecto al tocar */

    .click-area:active {

      background:
        rgba(255,255,255,.08);

      transform:
        scale(.98);

    }



    /* ==============================
       BURBUJAS INVITACIÓN
       ============================== */

    #invitationBubbles {

      position: absolute;

      z-index: 3;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

    }



    /* ==============================
       TRANSICIÓN ENTRE PANTALLAS
       ============================== */

    .transition-wave {

      position: absolute;

      z-index: 30;

      bottom: -1px;

      left: 50%;

      width: 60px;
      height: 30px;

      transform:
        translateX(-50%);

      border-radius:
        50%
        50%
        0
        0;

      background: #fffaf5;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #65757d;

      font-size: 24px;

    }



    /* ==============================
       DESKTOP
       ============================== */

    @media
    (min-width: 850px) {

      .invitation-section {

        padding:
          40px
          0
          70px;

      }


      .invitation {

        border-radius:
          6px;

        box-shadow:
          0
          25px
          80px
          rgba(
            117,
            91,
            76,
            .10
          );

      }

    }



    /* ==============================
       ACCESIBILIDAD
       ============================== */

    @media
    (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {

        animation-duration:
          .001ms !important;

        animation-iteration-count:
          1 !important;

      }

    }

  </style>

</head>



<body>


  <!-- ========================================
       PRIMERA PANTALLA
       ======================================== -->

  <section
    class="ocean-cover"
    id="ocean"
  >


    <!-- burbujas -->

    <div id="oceanBubbles"></div>


    <div class="ocean-center">

      <h1 class="ocean-title">
        UNDER THE SEA
      </h1>

      <div class="ocean-wave">
        〰
      </div>

      <button
        class="scroll-button"
        id="scrollButton"
        aria-label="Ver invitación"
      >
        ↓
      </button>

    </div>


    <div
      class="transition-wave"
      aria-hidden="true"
    >
      ↓
    </div>


  </section>




  <!-- ========================================
       INVITACIÓN
       ======================================== -->

  <section
    class="invitation-section"
    id="invitationSection"
  >


    <div class="invitation">


      <!-- PIRATA -->

      <div class="pirate-wrapper">

        <img
          src="pirata.png"
          class="pirate"
          alt=""
        >

      </div>



      <!-- SIRENA -->

      <div class="mermaid-wrapper">

        <img
          src="sirena.png"
          class="mermaid"
          alt=""
        >

      </div>



      <!-- BURBUJAS QUE SALEN DESDE ABAJO -->

      <div id="invitationBubbles"></div>



      <!-- INFORMACIÓN CENTRAL -->

      <div class="information-layer">

        <img
          src="contenido-invitacion.png"
          alt="Invitación Under The Sea de Luca y Olivia"
        >

      </div>



      <!-- ====================================
           UBICACIÓN
           ==================================== -->

      <a

        class="click-area map-area"

        href="https://maps.app.goo.gl/qPQYuWRUw7UVQDpi6?g_st=ic"

        target="_blank"

        rel="noopener noreferrer"

        aria-label="Ver ubicación Plaza Tribeca en Google Maps"

      ></a>



      <!-- ====================================
           CONFIRMA ASISTENCIA
           ==================================== -->

      <a

        class="click-area confirm-area"

        id="confirmButton"

        href="#"

        aria-label="Confirmar asistencia por WhatsApp"

      ></a>



      <!-- ====================================
           PREGUNTAS
           ==================================== -->

      <a

        class="click-area questions-area"

        id="questionsButton"

        href="#"

        aria-label="Preguntas por WhatsApp"

      ></a>


    </div>


  </section>




  <script>


    /* ========================================
       CONFIGURACIÓN
       ======================================== */


    const whatsappNumber =
      "529987399674";


    const confirmMessage =
`Hola Airela
Confirmo mi asistencia al evento “Under The Sea”
Mi nombre es:`;


    const questionsMessage =
`Hola AIRELA
Tengo preguntas sobre el evento “Under The Sea”`;





    /* ========================================
       BOTÓN CONFIRMAR
       ======================================== */


    document
      .getElementById("confirmButton")
      .addEventListener(
        "click",
        function(event) {

          event.preventDefault();

          const whatsappURL =
            "https://wa.me/"
            + whatsappNumber
            + "?text="
            + encodeURIComponent(
                confirmMessage
              );

          window.open(
            whatsappURL,
            "_blank"
          );

        }
      );





    /* ========================================
       BOTÓN PREGUNTAS
       ======================================== */


    document
      .getElementById("questionsButton")
      .addEventListener(
        "click",
        function(event) {

          event.preventDefault();

          const whatsappURL =
            "https://wa.me/"
            + whatsappNumber
            + "?text="
            + encodeURIComponent(
                questionsMessage
              );

          window.open(
            whatsappURL,
            "_blank"
          );

        }
      );





    /* ========================================
       DESLIZAR A INVITACIÓN
       ======================================== */


    document
      .getElementById("scrollButton")
      .addEventListener(
        "click",
        function() {

          document
            .getElementById(
              "invitationSection"
            )
            .scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

        }
      );





    /* ========================================
       CREAR BURBUJAS
       ======================================== */


    function createBubbles(
      containerId,
      quantity
    ) {

      const container =
        document.getElementById(
          containerId
        );


      for (
        let i = 0;
        i < quantity;
        i++
      ) {

        const bubble =
          document.createElement(
            "span"
          );


        bubble.classList.add(
          "bubble"
        );


        const size =
          Math.random() * 27 + 8;


        const left =
          Math.random() * 96;


        const duration =
          Math.random() * 8 + 9;


        const delay =
          Math.random() * -18;


        const drift =
          Math.random() * 45 - 22;



        bubble.style.setProperty(
          "--size",
          size + "px"
        );


        bubble.style.setProperty(
          "--left",
          left + "%"
        );


        bubble.style.setProperty(
          "--duration",
          duration + "s"
        );


        bubble.style.setProperty(
          "--delay",
          delay + "s"
        );


        bubble.style.setProperty(
          "--drift",
          drift + "px"
        );


        container.appendChild(
          bubble
        );

      }

    }



    createBubbles(
      "oceanBubbles",
      22
    );


    createBubbles(
      "invitationBubbles",
      18
    );


  </script>


</body>

</html>
