<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Under The Sea - Luca & Olivia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f3ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    .invitation-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
      border-radius: 12px;
      background-color: white; /* Asegura que las olas se vean contra el fondo */
    }

    .invitation-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* CAPAS DE OLAS RODANTES (Superpuestas) */
    .wave-rolling {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%; /* El doble de ancho para el movimiento */
      height: 20%; /* Altura de la zona de olas */
      pointer-events: none;
      background-repeat: repeat-x;
      transform: translateZ(0); /* Mejora rendimiento */
    }

    /* OLA 1: Más rápida y transparente (Fondo) */
    .wave-rolling-1 {
      z-index: 4;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0 30V120H1200V30C1000 60 800 60 600 30C400 0 200 0 0 30Z" fill="%23FFFFFF" opacity="0.3"/></svg>');
      background-size: 50% 100%; /* Ajusta el patrón */
      animation: waveMoveLinear 6s linear infinite;
    }

    /* OLA 2: Más lenta y visible (Frente, efecto rodante) */
    .wave-rolling-2 {
      z-index: 5;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0 40V120H1200V40C1000 70 800 70 600 40C400 10 200 10 0 40Z" fill="%23FFFFFF" opacity="0.6"/></svg>');
      background-size: 50% 100%;
      animation: waveMoveLinear 10s linear infinite reverse; /* Movimiento contrario */
    }

    /* Animación de movimiento lineal constante */
    @keyframes waveMoveLinear {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%); /* Se desplaza media imagen para el loop */
      }
    }

    /* Contenedor de Burbujas */
    .bubbles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10; /* Por encima de las olas */
    }

    .bubble {
      position: absolute;
      bottom: -20px;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.6);
      animation: rise 7s ease-in infinite;
    }

    @keyframes rise {
      0% {
        bottom: -20px;
        transform: translateX(0) scale(0.5);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        bottom: 105%;
        transform: translateX(20px) scale(1.2);
        opacity: 0;
      }
    }

    /* Botones invisibles (Sin alterar nada más) */
    .clickable-area {
      position: absolute;
      cursor: pointer;
      z-index: 20; /* Por encima de todo */
    }

    .location-btn {
      top: 83.5%;
      left: 36%;
      width: 28%;
      height: 4%;
    }

    .rsvp-btn {
      top: 90.5%;
      left: 27.5%;
      width: 24.5%;
      height: 4.5%;
      border-radius: 20px;
    }

    .questions-btn {
      top: 90.5%;
      left: 54.5%;
      width: 17%;
      height: 4.5%;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="invitation-container">
    <img src="invitacion.png" alt="Invitación Under The Sea" class="invitation-img">

    <!-- CAPAS DE OLAS AGREGADAS -->
    <div class="wave-rolling wave-rolling-1"></div>
    <div class="wave-rolling wave-rolling-2"></div>

    <div class="bubbles-container" id="bubblesContainer"></div>

    <a href="https://maps.app.goo.gl/cYEomYKPKvier42R7" target="_blank" class="clickable-area location-btn" title="Ver ubicación en Plaza Saaghi"></a>
    <a id="rsvpLink" class="clickable-area rsvp-btn" target="_blank" title="Confirmar asistencia por WhatsApp"></a>
    <a id="questionsLink" class="clickable-area questions-btn" target="_blank" title="Hacer preguntas por WhatsApp"></a>
  </div>

  <script>
    const phone = "5219987399674";
    const textRSVP = "Hola AIRELA\nConfirmo mi asistencia\nMi nombre es:";
    const textQuestions = "Hola AIRELA\nTengo preguntas sobre Under The Sea";

    document.getElementById("rsvpLink").href = `https://wa.me/${phone}?text=${encodeURIComponent(textRSVP)}`;
    document.getElementById("questionsLink").href = `https://wa.me/${phone}?text=${encodeURIComponent(textQuestions)}`;

    function createBubbles() {
      const container = document.getElementById("bubblesContainer");
      const bubbleCount = 16; /* Ligeramente más burbujas */

      for (let i = 0; i < bubbleCount; i++) {
        const bubble = document.createElement("div");
        bubble.classList.add("bubble");

        const size = Math.random() * 16 + 8;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.random() * 90 + 5}%`;
        bubble.style.animationDelay = `${Math.random() * 4}s`;
        bubble.style.animationDuration = `${Math.random() * 3 + 5s`; /* Ligeramente más lentas */

        container.appendChild(bubble);
      }
    }

    window.addEventListener("DOMContentLoaded", createBubbles);
  </script>
</body>
</html>
