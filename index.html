<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Under The Sea | Luca & Olivia</title>

  <meta
    name="description"
    content="Under The Sea - Luca & Olivia"
  >

  <meta
    name="theme-color"
    content="#b9e4ef"
  >


  <!-- =========================================
       PORTADA DEL LINK
       CAMBIA TU-USUARIO AL PUBLICAR EN GITHUB
       ========================================= -->

  <meta
    property="og:title"
    content="Under The Sea | Luca & Olivia"
  >

  <meta
    property="og:description"
    content="Te esperamos para celebrar con nosotros."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://TU-USUARIO.github.io/under-the-sea/"
  >

  <meta
    property="og:image"
    content="https://TU-USUARIO.github.io/under-the-sea/portada-link.jpg"
  >



  <style>

    /* ==================================================
       GENERAL
       ================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
      background: #bce5ef;
    }


    body {

      margin: 0;

      overflow-x: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #fbf4ed;

    }


    img {

      display: block;

      max-width: 100%;

      user-select: none;

      -webkit-user-drag: none;

    }



    /* ==================================================
       1. PORTADA OCÉANO
       ================================================== */

    .ocean-cover {

      position: relative;

      width: 100%;

      height: 100svh;

      min-height: 600px;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;


      background-image:
        url("fondo-oceano.jpg");

      background-size: cover;

      background-position: center;

      background-repeat: no-repeat;

    }


    .ocean-cover::after {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 1;

      pointer-events: none;


      background:

        linear-gradient(

          to bottom,

          rgba(255,255,255,.02),

          rgba(143,213,230,.05)

        );

    }



    /* ==================================================
       TEXTO PORTADA
       ================================================== */

    .ocean-center {

      position: relative;

      z-index: 10;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      transform: translateY(2vh);

    }


    .ocean-title {

      color: white;

      font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size:
        clamp(
          21px,
          3vw,
          34px
        );

      font-weight: 300;

      letter-spacing:
        clamp(
          7px,
          1.5vw,
          15px
        );

      margin-left: .5em;


      text-shadow:

        0
        3px
        15px
        rgba(72,137,164,.15);

    }



    .ocean-wave {

      margin-top: 18px;

      color: white;

      font-size: 38px;

      line-height: 1;

      animation:
        smallWave
        3s
        ease-in-out
        infinite;

    }


    @keyframes smallWave {

      0%,
      100% {
        transform: translateX(-3px);
      }

      50% {
        transform: translateX(3px);
      }

    }



    /* ==================================================
       FLECHA
       ================================================== */

    .scroll-button {

      margin-top: 30px;

      width: 54px;

      height: 54px;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,.8);

      display: flex;

      justify-content: center;

      align-items: center;


      background:
        rgba(255,255,255,.15);


      color: white;

      font-size: 27px;

      cursor: pointer;


      backdrop-filter:
        blur(5px);


      -webkit-backdrop-filter:
        blur(5px);


      animation:
        arrowAnimation
        2s
        ease-in-out
        infinite;

    }


    @keyframes arrowAnimation {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(8px);
      }

    }



    /* ==================================================
       BURBUJAS
       ================================================== */

    .bubble {

      position: absolute;

      z-index: 6;

      bottom: -60px;

      left:
        var(--left);

      width:
        var(--size);

      height:
        var(--size);

      border-radius: 50%;

      opacity: 0;

      pointer-events: none;


      border:
        1px solid
        rgba(255,255,255,.65);


      background:

        radial-gradient(

          circle at 32% 28%,

          rgba(255,255,255,.95),

          rgba(255,255,255,.20) 27%,

          rgba(190,225,240,.12) 60%,

          rgba(255,255,255,.35)

        );


      animation:

        riseBubble
        var(--duration)
        linear
        var(--delay)
        infinite;

    }


    @keyframes riseBubble {

      0% {

        opacity: 0;

        transform:
          translateY(0)
          translateX(0)
          scale(.7);

      }


      12% {

        opacity: .58;

      }


      50% {

        transform:
          translateY(-55vh)
          translateX(var(--drift))
          scale(1);

      }


      90% {

        opacity: .42;

      }


      100% {

        opacity: 0;

        transform:
          translateY(-115vh)
          translateX(
            calc(
              var(--drift) * -.3
            )
          )
          scale(1.07);

      }

    }



    /* ==================================================
       2. SECCIÓN INVITACIÓN
       ================================================== */

    .invitation-section {

      position: relative;

      width: 100%;

      min-height: 100svh;

      padding:
        28px
        18px
        55px;

      display: flex;

      justify-content: center;

      align-items: center;


      background:

        linear-gradient(

          180deg,

          #fffaf5 0%,

          #fbf1e8 100%

        );

    }



    /* ==================================================
       TARJETA

       AHORA ES MUCHO MÁS ANCHA
       ================================================== */

    .invitation {

      position: relative;

      width:
        min(
          96vw,
          1180px
        );


      /*
       Antes era 2/3 (muy estrecha).

       Ahora tenemos una composición ancha
       para dejar laterales independientes.
      */

      aspect-ratio: 4 / 3;


      overflow: hidden;

      isolation: isolate;


      background:

        linear-gradient(

          145deg,

          #fffaf5,

          #faf1e9

        );


      border-radius: 4px;


      box-shadow:

        0
        22px
        70px
        rgba(
          116,
          90,
          76,
          .08
        );

    }



    /* textura muy sutil */

    .invitation::before {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 0;

      pointer-events: none;


      background:

        radial-gradient(

          circle at 50% 25%,

          rgba(255,255,255,.75),

          transparent 42%

        );

    }



    /* ==================================================
       CORREDOR CENTRAL

       CREA UNA ZONA LIMPIA.
       LAS ILUSTRACIONES NO PUEDEN INVADIRLA.
       ================================================== */

    .safe-center {

      position: absolute;

      z-index: 5;

      top: 0;

      bottom: 0;

      left: 26%;

      right: 26%;


      pointer-events: none;


      background:

        linear-gradient(

          90deg,

          rgba(255,250,245,0) 0%,

          rgba(255,250,245,.90) 5%,

          rgba(255,250,245,.99) 13%,

          #fffaf5 23%,

          #fffaf5 77%,

          rgba(255,250,245,.99) 87%,

          rgba(255,250,245,.90) 95%,

          rgba(255,250,245,0) 100%

        );

    }



    /* ==================================================
       ZONA PIRATA

       IMPORTANTE:
       overflow:hidden evita completamente
       que el barco llegue al contenido.
       ================================================== */

    .pirate-wrapper {

      position: absolute;

      z-index: 2;

      left: 0;

      top: 0;

      bottom: 0;


      /*
       SOLO puede ocupar este 26%
       izquierdo de la invitación.
      */

      width: 26%;


      overflow: hidden;

      pointer-events: none;

    }



    .pirate {

      position: absolute;


      /*
       Hacemos la imagen grande dentro
       de su propia zona, pero la zona
       la corta antes del texto.
      */

      width: 185%;

      max-width: none;

      left: -72%;

      bottom: -1.5%;


      transform-origin:
        60%
        75%;


      animation:

        pirateMovement
        6s
        ease-in-out
        infinite;


      filter:

        drop-shadow(

          0
          5px
          4px
          rgba(100,75,60,.035)

        );

    }



    @keyframes pirateMovement {

      0%,
      100% {

        transform:

          translateY(2px)

          rotate(-.35deg);

      }


      50% {

        transform:

          translateY(-5px)

          rotate(.45deg);

      }

    }



    /* ==================================================
       ZONA SIRENA

       Igual: jamás entra al centro.
       ================================================== */

    .mermaid-wrapper {

      position: absolute;

      z-index: 2;

      right: 0;

      top: 0;

      bottom: 0;


      width: 26%;


      overflow: hidden;

      pointer-events: none;

    }



    .mermaid {

      position: absolute;


      width: 185%;

      max-width: none;

      right: -72%;

      bottom: -1%;


      transform-origin:
        42%
        70%;


      animation:

        mermaidMovement
        6.5s
        ease-in-out
        infinite;


      filter:

        drop-shadow(

          0
          5px
          4px
          rgba(170,115,145,.025)

        );

    }



    @keyframes mermaidMovement {

      0%,
      100% {

        transform:

          translateY(2px)

          rotate(.18deg);

      }


      50% {

        transform:

          translateY(-4px)

          rotate(-.30deg);

      }

    }



    /* ==================================================
       BURBUJAS INVITACIÓN
       ================================================== */

    #invitationBubbles {

      position: absolute;

      inset: 0;

      z-index: 4;

      overflow: hidden;

      pointer-events: none;

    }



    /* ==================================================
       CONTENIDO

       AHORA SOLO OCUPA EL CENTRO.
       ================================================== */

    .information-layer {

      position: absolute;

      z-index: 10;


      top: 50%;

      left: 50%;


      /*
       Esta es la clave.

       La información ocupa solo
       la parte central y deja
       mucho aire a izquierda y derecha.
      */

      width: 46%;

      height: 96%;


      transform:
        translate(
          -50%,
          -50%
        );


      display: flex;

      justify-content: center;

      align-items: center;


      pointer-events: none;

    }



    .information-layer img {

      width: 100%;

      height: 100%;

      object-fit: contain;

    }



    /* ==================================================
       CLICS

       Estas áreas se posicionan dentro
       del área CENTRAL, no en todo el canvas.
       ================================================== */

    .interactive-center {

      position: absolute;

      z-index: 20;


      top: 50%;

      left: 50%;


      width: 46%;

      height: 96%;


      transform:
        translate(
          -50%,
          -50%
        );


      pointer-events: none;

    }



    .click-area {

      position: absolute;

      display: block;

      pointer-events: auto;

      cursor: pointer;

      background: transparent;

      border: none;

      text-decoration: none;

      -webkit-tap-highlight-color:
        transparent;

    }



    /*
     PLAZA TRIBECA
    */

    .map-area {

      left: 24%;

      top: 74%;

      width: 52%;

      height: 8%;

    }



    /*
     CONFIRMA ASISTENCIA
    */

    .confirm-area {

      left: 2%;

      top: 87%;

      width: 51%;

      height: 9%;

      border-radius: 100px;

    }



    /*
     PREGUNTAS
    */

    .questions-area {

      right: 2%;

      top: 87%;

      width: 43%;

      height: 9%;

      border-radius: 100px;

    }



    .click-area:active {

      background:
        rgba(255,255,255,.08);

    }



    /* ==================================================
       TABLET
       ================================================== */

    @media
    (max-width: 900px) {

      .invitation {

        width: 98vw;

        aspect-ratio: 1 / 1;

      }


      .pirate-wrapper {

        width: 24%;

      }


      .mermaid-wrapper {

        width: 24%;

      }


      .safe-center {

        left: 24%;

        right: 24%;

      }


      .information-layer,
      .interactive-center {

        width: 52%;

        height: 95%;

      }


      .pirate {

        width: 210%;

        left: -95%;

      }


      .mermaid {

        width: 210%;

        right: -95%;

      }

    }



    /* ==================================================
       CELULAR
       ================================================== */

    @media
    (max-width: 600px) {

      .invitation-section {

        padding:
          0
          0
          35px;

      }


      .invitation {

        width: 100vw;


        /*
         En teléfono sigue siendo
         más vertical para que el texto
         no quede demasiado pequeño.
        */

        aspect-ratio: 3 / 4;

        border-radius: 0;

        box-shadow: none;

      }



      /*
       En celular reducimos todavía
       más el espacio de decoraciones.
      */

      .pirate-wrapper {

        width: 18%;

      }


      .mermaid-wrapper {

        width: 18%;

      }



      .safe-center {

        left: 18%;

        right: 18%;

      }



      .information-layer,
      .interactive-center {

        width: 64%;

        height: 96%;

      }



      .pirate {

        width: 310%;

        left: -205%;

        bottom: 0;

      }



      .mermaid {

        width: 310%;

        right: -205%;

        bottom: 0;

      }


      .ocean-title {

        font-size: 20px;

        letter-spacing: 6px;

      }

    }



    /* ==================================================
       MOVIMIENTO REDUCIDO
       ================================================== */

    @media
    (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }


      *,
      *::before,
      *::after {

        animation-duration:
          .001ms !important;

        animation-iteration-count:
          1 !important;

      }

    }


  </style>

</head>



<body>


  <!-- ==================================================
       PANTALLA 1 — OCÉANO
       ================================================== -->

  <section

    class="ocean-cover"

    id="ocean"

  >


    <div id="oceanBubbles"></div>


    <div class="ocean-center">


      <h1 class="ocean-title">

        UNDER THE SEA

      </h1>


      <div class="ocean-wave">

        〰

      </div>


      <button

        class="scroll-button"

        id="scrollButton"

        aria-label="Ver invitación"

      >

        ↓

      </button>


    </div>


  </section>




  <!-- ==================================================
       PANTALLA 2 — INVITACIÓN
       ================================================== -->

  <section

    class="invitation-section"

    id="invitationSection"

  >


    <div class="invitation">



      <!-- ==============================================
           PIRATA
           LIMITADO A LA IZQUIERDA
           ============================================== -->

      <div class="pirate-wrapper">


        <img

          src="pirata.png"

          class="pirate"

          alt=""

        >


      </div>



      <!-- ==============================================
           SIRENA
           LIMITADA A LA DERECHA
           ============================================== -->

      <div class="mermaid-wrapper">


        <img

          src="sirena.png"

          class="mermaid"

          alt=""

        >


      </div>



      <!-- ==============================================
           BURBUJAS
           ============================================== -->

      <div id="invitationBubbles"></div>



      <!-- ==============================================
           ZONA CREMA QUE PROTEGE EL TEXTO
           ============================================== -->

      <div class="safe-center"></div>



      <!-- ==============================================
           INFORMACIÓN
           ============================================== -->

      <div class="information-layer">


        <img

          src="contenido-invitacion.png"

          alt="Invitación Under The Sea de Luca y Olivia"

        >


      </div>



      <!-- ==============================================
           ÁREAS INTERACTIVAS
           ============================================== -->

      <div class="interactive-center">



        <!-- GOOGLE MAPS -->

        <a

          class="click-area map-area"

          href="https://maps.app.goo.gl/qPQYuWRUw7UVQDpi6?g_st=ic"

          target="_blank"

          rel="noopener noreferrer"

          aria-label="Abrir Plaza Tribeca en Google Maps"

        ></a>



        <!-- CONFIRMAR -->

        <a

          class="click-area confirm-area"

          id="confirmButton"

          href="#"

          aria-label="Confirmar asistencia por WhatsApp"

        ></a>



        <!-- PREGUNTAS -->

        <a

          class="click-area questions-area"

          id="questionsButton"

          href="#"

          aria-label="Preguntas por WhatsApp"

        ></a>


      </div>


    </div>


  </section>




  <script>


    /* ==================================================
       WHATSAPP
       ================================================== */

    const whatsappNumber =
      "529987399674";



    const confirmMessage =
`Hola Airela
Confirmo mi asistencia al evento “Under The Sea”
Mi nombre es:`;



    const questionsMessage =
`Hola AIRELA
Tengo preguntas sobre el evento “Under The Sea”`;




    /* ==================================================
       CONFIRMAR
       ================================================== */

    document
      .getElementById(
        "confirmButton"
      )
      .addEventListener(

        "click",

        function(event) {

          event.preventDefault();


          const url =

            "https://wa.me/"
            +
            whatsappNumber
            +
            "?text="
            +
            encodeURIComponent(
              confirmMessage
            );


          window.open(
            url,
            "_blank"
          );

        }

      );




    /* ==================================================
       PREGUNTAS
       ================================================== */

    document
      .getElementById(
        "questionsButton"
      )
      .addEventListener(

        "click",

        function(event) {

          event.preventDefault();


          const url =

            "https://wa.me/"
            +
            whatsappNumber
            +
            "?text="
            +
            encodeURIComponent(
              questionsMessage
            );


          window.open(
            url,
            "_blank"
          );

        }

      );




    /* ==================================================
       BAJAR A INVITACIÓN
       ================================================== */

    document
      .getElementById(
        "scrollButton"
      )
      .addEventListener(

        "click",

        function() {


          document
            .getElementById(
              "invitationSection"
            )
            .scrollIntoView({

              behavior:
                "smooth",

              block:
                "start"

            });


        }

      );




    /* ==================================================
       CREAR BURBUJAS
       ================================================== */

    function createBubbles(
      containerId,
      quantity
    ) {


      const container =
        document.getElementById(
          containerId
        );


      for (
        let i = 0;
        i < quantity;
        i++
      ) {


        const bubble =
          document.createElement(
            "span"
          );


        bubble.classList.add(
          "bubble"
        );


        const size =
          Math.random() * 26 + 8;


        const left =
          Math.random() * 96;


        const duration =
          Math.random() * 8 + 9;


        const delay =
          Math.random() * -18;


        const drift =
          Math.random() * 44 - 22;


        bubble.style.setProperty(
          "--size",
          size + "px"
        );


        bubble.style.setProperty(
          "--left",
          left + "%"
        );


        bubble.style.setProperty(
          "--duration",
          duration + "s"
        );


        bubble.style.setProperty(
          "--delay",
          delay + "s"
        );


        bubble.style.setProperty(
          "--drift",
          drift + "px"
        );


        container.appendChild(
          bubble
        );

      }

    }


    createBubbles(
      "oceanBubbles",
      22
    );


    createBubbles(
      "invitationBubbles",
      16
    );


  </script>


</body>

</html>
