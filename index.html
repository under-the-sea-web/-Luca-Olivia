<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Under The Sea | Luca & Olivia</title>

  <meta
    name="description"
    content="Under The Sea - Luca & Olivia"
  >

  <meta
    name="theme-color"
    content="#b9e4ef"
  >


  <!-- ==========================================
       PORTADA DEL LINK
       CAMBIAR TU-USUARIO CUANDO PUBLIQUES
       ========================================== -->

  <meta
    property="og:title"
    content="Under The Sea | Luca & Olivia"
  >

  <meta
    property="og:description"
    content="Te esperamos para celebrar con nosotros."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://TU-USUARIO.github.io/under-the-sea/"
  >

  <meta
    property="og:image"
    content="https://TU-USUARIO.github.io/under-the-sea/portada-link.jpg"
  >

  <meta
    property="og:image:width"
    content="1024"
  >

  <meta
    property="og:image:height"
    content="1536"
  >



  <style>

    /* ==================================================
       CONFIGURACIÓN GENERAL
       ================================================== */

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    html {

      scroll-behavior: smooth;

      background: #bce5ef;

    }


    body {

      margin: 0;

      overflow-x: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #faf4ee;

    }


    img {

      display: block;

      user-select: none;

      -webkit-user-drag: none;

    }



    /* ==================================================
       PRIMERA PANTALLA
       OCÉANO
       ================================================== */

    .ocean-cover {

      position: relative;

      width: 100%;

      height: 100svh;

      min-height: 600px;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;


      background-image:
        url("fondo-oceano.jpg");

      background-size: cover;

      background-position: center;

      background-repeat: no-repeat;

    }



    .ocean-cover::after {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 1;

      pointer-events: none;


      background:

        linear-gradient(

          to bottom,

          rgba(255,255,255,.05),

          rgba(132,206,226,.06)

        );

    }



    /* ==================================================
       TEXTO UNDER THE SEA
       ================================================== */

    .ocean-center {

      position: relative;

      z-index: 10;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: white;

      transform: translateY(3vh);

    }


    .ocean-title {

      font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size:
        clamp(
          20px,
          4vw,
          34px
        );

      font-weight: 300;

      letter-spacing:
        clamp(
          6px,
          2vw,
          15px
        );

      margin-left: .5em;

      color:
        rgba(
          255,
          255,
          255,
          .97
        );

      text-shadow:

        0
        3px
        14px
        rgba(
          71,
          133,
          161,
          .14
        );

    }



    .ocean-wave {

      margin-top: 18px;

      font-size: 38px;

      font-weight: 200;

      line-height: 1;

      color:
        rgba(
          255,
          255,
          255,
          .94
        );

      animation:

        oceanWaveMove
        3s
        ease-in-out
        infinite;

    }



    @keyframes oceanWaveMove {

      0%,
      100% {

        transform:
          translateX(-3px);

      }

      50% {

        transform:
          translateX(3px);

      }

    }



    /* ==================================================
       FLECHA
       ================================================== */

    .scroll-button {

      margin-top: 32px;

      width: 54px;

      height: 54px;

      border-radius: 50%;

      border:

        1px
        solid
        rgba(
          255,
          255,
          255,
          .82
        );

      display: flex;

      justify-content: center;

      align-items: center;


      background:

        rgba(
          255,
          255,
          255,
          .15
        );


      backdrop-filter:

        blur(6px);


      -webkit-backdrop-filter:

        blur(6px);


      color: white;

      font-size: 27px;

      font-weight: 200;

      cursor: pointer;


      box-shadow:

        0
        8px
        30px
        rgba(
          57,
          118,
          147,
          .12
        );


      animation:

        arrowMove
        2s
        ease-in-out
        infinite;

    }



    @keyframes arrowMove {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(9px);

      }

    }



    /* ==================================================
       BURBUJAS GENERALES
       ================================================== */

    .bubble {

      position: absolute;

      bottom: -100px;

      left:
        var(--left);

      width:
        var(--size);

      height:
        var(--size);

      border-radius: 50%;

      z-index: 6;

      pointer-events: none;

      opacity: 0;


      border:

        1px
        solid
        rgba(
          255,
          255,
          255,
          .65
        );


      background:

        radial-gradient(

          circle
          at 32% 28%,

          rgba(
            255,
            255,
            255,
            .92
          ),

          rgba(
            255,
            255,
            255,
            .22
          )
          28%,

          rgba(
            183,
            223,
            240,
            .14
          )
          60%,

          rgba(
            255,
            255,
            255,
            .34
          )

        );


      box-shadow:

        inset
        1px
        1px
        7px
        rgba(
          255,
          255,
          255,
          .75
        );


      animation:

        riseBubble
        var(--duration)
        linear
        var(--delay)
        infinite;

    }



    @keyframes riseBubble {

      0% {

        opacity: 0;

        transform:

          translate3d(
            0,
            0,
            0
          )

          scale(.72);

      }


      10% {

        opacity: .55;

      }


      50% {

        transform:

          translate3d(
            var(--drift),
            -55vh,
            0
          )

          scale(1);

      }


      90% {

        opacity: .4;

      }


      100% {

        opacity: 0;

        transform:

          translate3d(
            calc(
              var(--drift) * -.3
            ),
            -115vh,
            0
          )

          scale(1.08);

      }

    }



    /* ==================================================
       TRANSICIÓN INFERIOR
       ================================================== */

    .transition-circle {

      position: absolute;

      z-index: 20;

      bottom: -1px;

      left: 50%;

      transform:
        translateX(-50%);

      width: 55px;

      height: 28px;

      border-radius:

        50%
        50%
        0
        0;

      background: #fffaf5;

    }




    /* ==================================================
       SEGUNDA PANTALLA
       ================================================== */

    .invitation-section {

      position: relative;

      width: 100%;

      min-height: 100svh;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      overflow: hidden;


      background:

        linear-gradient(

          180deg,

          #fffaf5
          0%,

          #faf2ea
          100%

        );

    }



    /* ==================================================
       TARJETA DE INVITACIÓN
       ================================================== */

    .invitation {

      position: relative;

      width:

        min(
          100vw,
          760px
        );

      aspect-ratio:
        2 / 3;

      min-height: 580px;

      overflow: hidden;

      isolation: isolate;


      background:

        linear-gradient(

          145deg,

          #fffaf5,

          #faf1e9

        );

    }



    /* textura perla */

    .invitation::before {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 0;

      pointer-events: none;

      opacity: .18;


      background-image:

        radial-gradient(

          circle
          at 30% 20%,

          white
          0,

          transparent
          36%

        ),

        radial-gradient(

          circle
          at 75% 65%,

          #f7dfe2
          0,

          transparent
          42%

        );

    }



    /* ==================================================
       ZONA CENTRAL PROTEGIDA

       ESTA ES LA PARTE IMPORTANTE:
       evita que pirata/sirena interfieran
       con toda la información.
       ================================================== */

    .invitation::after {

      content: "";

      position: absolute;

      z-index: 4;

      top: 5%;

      bottom: 7%;

      left: 50%;

      transform:
        translateX(-50%);

      width: 68%;

      pointer-events: none;


      background:

        linear-gradient(

          90deg,

          rgba(
            255,
            250,
            245,
            0
          )
          0%,

          rgba(
            255,
            250,
            245,
            .78
          )
          8%,

          rgba(
            255,
            250,
            245,
            .96
          )
          19%,

          rgba(
            255,
            250,
            245,
            .98
          )
          30%,

          rgba(
            255,
            250,
            245,
            .98
          )
          70%,

          rgba(
            255,
            250,
            245,
            .96
          )
          81%,

          rgba(
            255,
            250,
            245,
            .78
          )
          92%,

          rgba(
            255,
            250,
            245,
            0
          )
          100%

        );

    }



    /* ==================================================
       PIRATA
       ================================================== */

    .pirate-wrapper {

      position: absolute;

      z-index: 1;

      left: -12%;

      bottom: -1%;

      width: 48%;

      transform-origin:
        46%
        73%;

      pointer-events: none;


      animation:

        pirateRock
        6s
        ease-in-out
        infinite;

    }


    .pirate {

      width: 100%;

      height: auto;

      filter:

        drop-shadow(

          0
          7px
          4px
          rgba(
            110,
            88,
            70,
            .035
          )

        );

    }



    @keyframes pirateRock {

      0%,
      100% {

        transform:

          translateY(1px)

          rotate(-.32deg);

      }


      50% {

        transform:

          translateY(-4px)

          rotate(.42deg);

      }

    }




    /* ==================================================
       SIRENA
       ================================================== */

    .mermaid-wrapper {

      position: absolute;

      z-index: 1;

      right: -12%;

      bottom: -1%;

      width: 46%;

      transform-origin:
        58%
        73%;

      pointer-events: none;


      animation:

        mermaidMove
        6.5s
        ease-in-out
        infinite;

    }


    .mermaid {

      width: 100%;

      height: auto;

      filter:

        drop-shadow(

          0
          7px
          4px
          rgba(
            170,
            119,
            145,
            .03
          )

        );

    }



    @keyframes mermaidMove {

      0%,
      100% {

        transform:

          translateY(1px)

          rotate(.15deg)

          skewX(0deg);

      }


      50% {

        transform:

          translateY(-4px)

          rotate(-.30deg)

          skewX(.25deg);

      }

    }



    /* ==================================================
       BURBUJAS DE LA INVITACIÓN

       Van por detrás del texto.
       ================================================== */

    #invitationBubbles {

      position: absolute;

      inset: 0;

      z-index: 3;

      overflow: hidden;

      pointer-events: none;

    }




    /* ==================================================
       INFORMACIÓN CENTRAL
       SIEMPRE POR ENCIMA
       ================================================== */

    .information-layer {

      position: absolute;

      z-index: 10;

      inset: 0;

      display: flex;

      justify-content: center;

      align-items: center;

      pointer-events: none;

    }



    .information-layer img {

      width: 100%;

      height: 100%;

      object-fit: contain;

    }




    /* ==================================================
       ÁREAS CLICABLES
       ================================================== */

    .click-area {

      position: absolute;

      z-index: 30;

      display: block;

      background: transparent;

      border: none;

      cursor: pointer;

      text-decoration: none;

      -webkit-tap-highlight-color:
        transparent;

    }



    /* ubicación */

    .map-area {

      left: 28%;

      top: 75%;

      width: 44%;

      height: 8%;

    }



    /* confirmar asistencia */

    .confirm-area {

      left: 5%;

      top: 87%;

      width: 47%;

      height: 9%;

      border-radius: 100px;

    }



    /* preguntas */

    .questions-area {

      right: 5%;

      top: 87%;

      width: 42%;

      height: 9%;

      border-radius: 100px;

    }



    .click-area:active {

      transform:
        scale(.985);

      background:

        rgba(
          255,
          255,
          255,
          .06
        );

    }




    /* ==================================================
       COMPUTADORA
       ================================================== */

    @media
    (min-width: 850px) {

      .invitation-section {

        padding:

          40px
          0
          70px;

      }


      .invitation {

        border-radius: 5px;


        box-shadow:

          0
          25px
          80px
          rgba(
            117,
            91,
            76,
            .09
          );

      }

    }




    /* ==================================================
       CELULARES PEQUEÑOS
       ================================================== */

    @media
    (max-width: 500px) {

      .pirate-wrapper {

        left: -15%;

        width: 50%;

      }


      .mermaid-wrapper {

        right: -15%;

        width: 48%;

      }


      .invitation::after {

        width: 70%;

      }


      .ocean-title {

        font-size: 19px;

        letter-spacing: 6px;

      }

    }




    /* ==================================================
       ACCESIBILIDAD
       ================================================== */

    @media
    (prefers-reduced-motion: reduce) {

      html {

        scroll-behavior: auto;

      }


      *,
      *::before,
      *::after {

        animation-duration:
          .001ms !important;

        animation-iteration-count:
          1 !important;

      }

    }



  </style>

</head>



<body>



  <!-- ==================================================
       PRIMERA PANTALLA
       ================================================== -->

  <section

    class="ocean-cover"

    id="ocean"

  >



    <!-- Burbujas -->

    <div id="oceanBubbles"></div>



    <!-- Texto central -->

    <div class="ocean-center">


      <h1 class="ocean-title">

        UNDER THE SEA

      </h1>


      <div class="ocean-wave">

        〰

      </div>


      <button

        class="scroll-button"

        id="scrollButton"

        aria-label="Ver invitación"

      >

        ↓

      </button>


    </div>



    <div

      class="transition-circle"

      aria-hidden="true"

    ></div>



  </section>





  <!-- ==================================================
       SEGUNDA PANTALLA
       ================================================== -->

  <section

    class="invitation-section"

    id="invitationSection"

  >



    <div class="invitation">



      <!-- ==============================================
           PIRATA + OLAS
           ============================================== -->

      <div class="pirate-wrapper">


        <img

          src="pirata.png"

          class="pirate"

          alt=""

        >


      </div>





      <!-- ==============================================
           SIRENA + OLAS
           ============================================== -->

      <div class="mermaid-wrapper">


        <img

          src="sirena.png"

          class="mermaid"

          alt=""

        >


      </div>





      <!-- ==============================================
           BURBUJAS
           ============================================== -->

      <div id="invitationBubbles"></div>





      <!-- ==============================================
           INFORMACIÓN
           ============================================== -->

      <div class="information-layer">


        <img

          src="contenido-invitacion.png"

          alt="Invitación Under The Sea de Luca y Olivia"

        >


      </div>





      <!-- ==============================================
           GOOGLE MAPS
           ============================================== -->

      <a

        class="click-area map-area"

        href="https://maps.app.goo.gl/qPQYuWRUw7UVQDpi6?g_st=ic"

        target="_blank"

        rel="noopener noreferrer"

        aria-label="Abrir Plaza Tribeca en Google Maps"

      ></a>





      <!-- ==============================================
           CONFIRMAR ASISTENCIA
           ============================================== -->

      <a

        class="click-area confirm-area"

        id="confirmButton"

        href="#"

        aria-label="Confirmar asistencia por WhatsApp"

      ></a>





      <!-- ==============================================
           PREGUNTAS
           ============================================== -->

      <a

        class="click-area questions-area"

        id="questionsButton"

        href="#"

        aria-label="Enviar preguntas por WhatsApp"

      ></a>



    </div>


  </section>





  <script>


    /* ==================================================
       WHATSAPP
       ================================================== */


    const whatsappNumber =
      "529987399674";



    const confirmMessage =
`Hola Airela
Confirmo mi asistencia al evento “Under The Sea”
Mi nombre es:`;



    const questionsMessage =
`Hola AIRELA
Tengo preguntas sobre el evento “Under The Sea”`;





    /* ==================================================
       CONFIRMAR ASISTENCIA
       ================================================== */


    document
      .getElementById(
        "confirmButton"
      )
      .addEventListener(

        "click",

        function(event) {


          event.preventDefault();


          const whatsappURL =

            "https://wa.me/"
            +
            whatsappNumber
            +
            "?text="
            +
            encodeURIComponent(
              confirmMessage
            );


          window.open(

            whatsappURL,

            "_blank"

          );


        }

      );





    /* ==================================================
       PREGUNTAS
       ================================================== */


    document
      .getElementById(
        "questionsButton"
      )
      .addEventListener(

        "click",

        function(event) {


          event.preventDefault();


          const whatsappURL =

            "https://wa.me/"
            +
            whatsappNumber
            +
            "?text="
            +
            encodeURIComponent(
              questionsMessage
            );


          window.open(

            whatsappURL,

            "_blank"

          );


        }

      );





    /* ==================================================
       FLECHA → INVITACIÓN
       ================================================== */


    document
      .getElementById(
        "scrollButton"
      )
      .addEventListener(

        "click",

        function() {


          document
            .getElementById(
              "invitationSection"
            )
            .scrollIntoView({

              behavior:
                "smooth",

              block:
                "start"

            });


        }

      );





    /* ==================================================
       CREAR BURBUJAS
       ================================================== */


    function createBubbles(

      containerId,

      quantity

    ) {


      const container =

        document
          .getElementById(
            containerId
          );



      for (

        let i = 0;

        i < quantity;

        i++

      ) {


        const bubble =

          document
            .createElement(
              "span"
            );



        bubble
          .classList
          .add(
            "bubble"
          );



        const size =

          Math.random()
          *
          26
          +
          8;



        const left =

          Math.random()
          *
          96;



        const duration =

          Math.random()
          *
          8
          +
          9;



        const delay =

          Math.random()
          *
          -18;



        const drift =

          Math.random()
          *
          45
          -
          22;



        bubble
          .style
          .setProperty(

            "--size",

            size + "px"

          );



        bubble
          .style
          .setProperty(

            "--left",

            left + "%"

          );



        bubble
          .style
          .setProperty(

            "--duration",

            duration + "s"

          );



        bubble
          .style
          .setProperty(

            "--delay",

            delay + "s"

          );



        bubble
          .style
          .setProperty(

            "--drift",

            drift + "px"

          );



        container
          .appendChild(
            bubble
          );


      }


    }





    /* Burbujas portada */

    createBubbles(

      "oceanBubbles",

      22

    );



    /* Burbujas invitación */

    createBubbles(

      "invitationBubbles",

      15

    );



  </script>



</body>

</html>
