<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Under The Sea - Luca & Olivia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f3ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    .invitation-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
      border-radius: 12px;
      background-color: #ffffff;
    }

    .invitation-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* OLAS AJUSTADAS: Mayor transparencia y altura adecuada */
    .wave-rolling {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 32%; /* Cubre mejor desde el borde inferior */
      pointer-events: none;
      background-repeat: repeat-x;
    }

    .wave-rolling-1 {
      z-index: 4;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,40 C150,90 350,10 500,60 C650,110 900,20 1200,50 L1200,120 L0,120 Z" fill="rgba(255,255,255,0.22)"/></svg>');
      background-size: 50% 100%;
      animation: waveMoveLinear 9s linear infinite;
    }

    .wave-rolling-2 {
      z-index: 5;
      background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,60 C200,10 400,80 600,30 C800,-10 1000,60 1200,40 L1200,120 L0,120 Z" fill="rgba(255,255,255,0.35)"/></svg>');
      background-size: 50% 100%;
      animation: waveMoveLinear 6s linear infinite reverse;
    }

    @keyframes waveMoveLinear {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    /* BURBUJAS */
    .bubbles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .bubble {
      position: absolute;
      bottom: -20px;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.6);
      animation: rise 6s ease-in infinite;
    }

    @keyframes rise {
      0% {
        bottom: -20px;
        transform: translateX(0) scale(0.5);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        bottom: 105%;
        transform: translateX(20px) scale(1.2);
        opacity: 0;
      }
    }

    /* BOTONES INVISIBLES */
    .clickable-area {
      position: absolute;
      cursor: pointer;
      z-index: 20;
    }

    .location-btn {
      top: 83.5%;
      left: 36%;
      width: 28%;
      height: 4%;
    }

    .rsvp-btn {
      top: 90.5%;
      left: 27.5%;
      width: 24.5%;
      height: 4.5%;
      border-radius: 20px;
    }

    .questions-btn {
      top: 90.5%;
      left: 54.5%;
      width: 17%;
      height: 4.5%;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="invitation-container">
    <img src="invitacion.png" alt="Invitación Under The Sea" class="invitation-img">

    <div class="wave-rolling wave-rolling-1"></div>
    <div class="wave-rolling wave-rolling-2"></div>

    <div class="bubbles-container" id="bubblesContainer"></div>

    <a href="https://maps.app.goo.gl/cYEomYKPKvier42R7" target="_blank" class="clickable-area location-btn" title="Ver ubicación en Plaza Saaghi"></a>
    <a id="rsvpLink" class="clickable-area rsvp-btn" target="_blank" title="Confirmar asistencia por WhatsApp"></a>
    <a id="questionsLink" class="clickable-area questions-btn" target="_blank" title="Hacer preguntas por WhatsApp"></a>
  </div>

  <script>
    const phone = "5219987399674";
    const textRSVP = "Hola AIRELA\nConfirmo mi asistencia\nMi nombre es:";
    const textQuestions = "Hola AIRELA\nTengo preguntas sobre Under The Sea";

    document.getElementById("rsvpLink").href = `https://wa.me/${phone}?text=${encodeURIComponent(textRSVP)}`;
    document.getElementById("questionsLink").href = `https://wa.me/${phone}?text=${encodeURIComponent(textQuestions)}`;

    function createBubbles() {
      const container = document.getElementById("bubblesContainer");
      const bubbleCount = 16;

      for (let i = 0; i < bubbleCount; i++) {
        const bubble = document.createElement("div");
        bubble.classList.add("bubble");

        const size = Math.random() * 16 + 8;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.random() * 90 + 5}%`;
        bubble.style.animationDelay = `${Math.random() * 4}s`;
        bubble.style.animationDuration = `${Math.random() * 3 + 4}s`;

        container.appendChild(bubble);
      }
    }

    window.addEventListener("DOMContentLoaded", createBubbles);
  </script>
</body>
</html>
