<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Under The Sea - Luca & Olivia</title>

  <meta property="og:title" content="Invitación Under The Sea - Luca & Olivia">
  <meta property="og:description" content="¡Acompáñanos a celebrar el cumpleaños de Luca & Olivia!">
  <meta property="og:image" content="https://under-the-sea-web.github.io/-Luca-Olivia/portada.png">
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f3ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    .invitation-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
      border-radius: 12px;
      background-color: #ffffff;
    }

    .invitation-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* OLA AZUL (Lado Izquierdo) */
    .wave-blue-overlay {
      position: absolute;
      bottom: 0;
      left: -10px;
      width: 55%;
      height: 45%;
      pointer-events: none;
      z-index: 5;
      animation: waveBlueSway 5s ease-in-out infinite alternate;
      transform-origin: bottom left;
    }

    /* OLA ROSADA (Lado Derecho) */
    .wave-pink-overlay {
      position: absolute;
      bottom: 0;
      right: -10px;
      width: 55%;
      height: 45%;
      pointer-events: none;
      z-index: 5;
      animation: wavePinkSway 6s ease-in-out infinite alternate;
      transform-origin: bottom right;
    }

    @keyframes waveBlueSway {
      0% {
        transform: rotate(0deg) scale(1) translateY(0px);
      }
      100% {
        transform: rotate(2deg) scale(1.03) translateY(-4px);
      }
    }

    @keyframes wavePinkSway {
      0% {
        transform: rotate(0deg) scale(1) translateY(0px);
      }
      100% {
        transform: rotate(-2deg) scale(1.03) translateY(-4px);
      }
    }

    /* BURBUJAS */
    .bubbles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .bubble {
      position: absolute;
      bottom: -20px;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.6);
      animation: rise 6s ease-in infinite;
    }

    @keyframes rise {
      0% {
        bottom: -20px;
        transform: translateX(0) scale(0.5);
        opacity: 0;
      }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% {
        bottom: 105%;
        transform: translateX(25px) scale(1.2);
        opacity: 0;
      }
    }

    /* BOTONES INTERACTIVOS */
    .clickable-area {
      position: absolute;
      cursor: pointer;
      z-index: 20;
    }

    .location-btn {
      top: 82%;
      left: 30%;
      width: 40%;
      height: 4%;
    }

    .rsvp-btn {
      top: 91.5%;
      left: 27.5%;
      width: 24.5%;
      height: 4.5%;
      border-radius: 20px;
    }

    .questions-btn {
      top: 91.5%;
      left: 54.5%;
      width: 18%;
      height: 4.5%;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="invitation-container">
    <img src="invitacion.png" alt="Invitación Under The Sea" class="invitation-img">

    <!-- Siluetas traslúcidas que animan las olas exactas -->
    <svg class="wave-blue-overlay" viewBox="0 0 200 200" preserveAspectRatio="none">
      <path d="M0,80 C60,90 120,130 180,200 L0,200 Z" fill="rgba(173, 203, 218, 0.25)" />
    </svg>

    <svg class="wave-pink-overlay" viewBox="0 0 200 200" preserveAspectRatio="none">
      <path d="M200,80 C140,90 80,130 20,200 L200,200 Z" fill="rgba(228, 185, 189, 0.25)" />
    </svg>

    <div class="bubbles-container" id="bubblesContainer"></div>

    <a href="https://maps.app.goo.gl/Zn2ipgjLzvojkB1x9" target="_blank" class="clickable-area location-btn" title="Ver ubicación en Plaza Tribeca"></a>
    <a id="rsvpLink" class="clickable-area rsvp-btn" target="_blank" title="Confirmar asistencia por WhatsApp"></a>
    <a id="questionsLink" class="clickable-area questions-btn" target="_blank" title="Hacer preguntas por WhatsApp"></a>
  </div>

  <script>
    const phone = "5219987399674";
    const textRSVP = "Hola AIRELA ✨\nConfirmo mi asistencia\nMi nombre es:";
    const textQuestions = "Hola AIRELA ✨\nTengo preguntas sobre el evento \"Under The Sea\"";

    document.getElementById("rsvpLink").href = `https://wa.me/${phone}?text=${encodeURIComponent(textRSVP)}`;
    document.getElementById("questionsLink").href = `https://wa.me/${phone}?text=${encodeURIComponent(textQuestions)}`;

    function createBubbles() {
      const container = document.getElementById("bubblesContainer");
      const bubbleCount = 18;

      for (let i = 0; i < bubbleCount; i++) {
        const bubble = document.createElement("div");
        bubble.classList.add("bubble");

        const size = Math.random() * 16 + 8;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.random() * 90 + 5}%`;
        bubble.style.animationDelay = `${Math.random() * 4}s`;
        bubble.style.animationDuration = `${Math.random() * 3 + 4}s`;

        container.appendChild(bubble);
      }
    }

    window.addEventListener("DOMContentLoaded", createBubbles);
  </script>
</body>
</html>
