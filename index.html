<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Luca & Olivia - Bajo el Mar</title>
    <style>
        /* --- ESTILOS GENERALES Y FUENTES --- */
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Open+Sans:wght@400;600&display=swap');

        :root {
            /* Colores de la paleta original */
            --bg-mar: #A7E2F2; /* Azul celeste pastel */
            --ola-perla: rgba(255, 255, 255, 0.4); /* Olas traslúcidas perla */
            --text-top: #FFFFFF; /* TEXTO "UNDER THE SEA" EN BLANCO */
            --bg-card: #F9F1E7; /* Beige arena claro */
            --text-name-luca: #5C7A8F; /* Azul grisáceo */
            --text-name-olivia: #CD8E8E; /* Rosa viejo */
            --text-beige-general: #D1B0A1; /* Beige de los textos informativos */
            --accent-blue: #9DBDCF;
            --accent-pink: #E1AFB8;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Oculta scroll inicial */
            font-family: 'Open Sans', sans-serif;
            background-color: var(--bg-mar);
        }

        /* --- SECCIÓN 1: INTRO (BAJO EL MAR) --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-mar);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            transition: transform 1s ease-in-out;
        }

        /* Texto "UNDER THE SEA" - Ahora en BLANCO */
        #intro-screen h1 {
            color: var(--text-top);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 400;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        /* Flecha indicadora */
        .down-arrow {
            color: var(--ola-perla);
            font-size: 3rem;
            animation: bounce 2s infinite;
        }

        /* Olas traslúcidas (efecto fondo) */
        .wave-bg {
            position: absolute;
            width: 200%;
            height: 100%;
            opacity: 0.3;
            background-repeat: repeat-x;
            background-position: 0 bottom;
            transform-origin: center bottom;
        }

        /* Representación de las olas traslúcidas */
        .wave-top {
            top: -150px;
            height: 300px;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg"><path fill="%23FFFFFF" fill-opacity="0.4" d="M0,192L48,197.3C96,203,192,213,288,192C384,171,480,117,576,112C672,107,768,149,864,160C960,171,1056,149,1152,128C1248,107,1344,85,1392,74.7L1440,64L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"></path></svg>');
            animation: waveFlow 20s linear infinite;
        }

        /* --- SECCIÓN 2: INVITACIÓN --- */
        #invitation-card {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-card);
            overflow-y: auto; /* Permite scroll dentro de la tarjeta */
            z-index: 50;
            transition: transform 1s ease-in-out;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estado activado (tras el clic) */
        body.active #intro-screen { transform: translateY(-100%); }
        body.active #invitation-card { transform: translateY(-100%); }
        body.active { overflow: auto; } /* Reactiva scroll global */

        /* Contenedor principal del diseño */
        .card-content {
            width: 100%;
            max-width: 600px;
            position: relative;
            text-align: center;
            color: var(--text-beige-general);
        }

        /* --- ELEMENTOS GRÁFICOS Y ANIMACIONES --- */
        
        /* Barco (Izquierda) */
        .svg-ship {
            position: absolute;
            left: -30px;
            top: 250px;
            width: 150px;
            height: auto;
            opacity: 0.9;
            animation: shipSway 4s ease-in-out infinite;
            z-index: 10;
        }

        /* Aleta de Sirena (Derecha) */
        .svg-mermaid-tail {
            position: absolute;
            right: -20px;
            bottom: 50px;
            width: 180px;
            height: auto;
            opacity: 0.9;
            transform-origin: bottom center;
            animation: tailFlutter 5s ease-in-out infinite;
            z-index: 10;
        }

        /* Cofre del Tesoro */
        .svg-treasure {
            position: absolute;
            left: 10px;
            bottom: 20px;
            width: 100px;
            height: auto;
            opacity: 0.8;
            z-index: 5;
        }

        /* Decoraciones de Olas y Corales (Fondo) */
        .svg-waves-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 1;
            opacity: 0.6;
        }
        
        /* Animación sutil de las olas del fondo */
        .wave-path-pink { animation: waveSwaySlight 6s ease-in-out infinite alternate; }
        .wave-path-blue { animation: waveSwaySlight 8s ease-in-out infinite alternate-reverse; }

        /* --- TEXTOS DE LA TARJETA --- */
        
        .divider-star { font-size: 1.5rem; margin: 15px 0; color: #E8C3A9; }

        .names-container {
            margin: 20px 0;
            position: relative;
            z-index: 20; /* Por encima de los gráficos */
        }

        .name-luca {
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            color: var(--text-name-luca);
            margin: 0;
            line-height: 1;
        }

        .ampersand {
            font-size: 2rem;
            color: var(--text-beige-general);
            margin: -10px 0;
            display: block;
        }

        .name-olivia {
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            color: var(--text-name-olivia);
            margin: 0;
            line-height: 1;
        }

        /* Bloques de Edad */
        .age-blocks {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            align-items: center;
        }

        .age-block {
            padding: 8px 20px;
            border-radius: 5px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: #FFFFFF;
        }
        .age-luca { background-color: var(--accent-blue); }
        .age-olivia { background-color: var(--accent-pink); }
        .age-star { color: #E8C3A9; font-size: 1.2rem; }

        /* Detalles del Evento */
        .event-details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 30px 0;
            text-align: center;
            border-top: 1px solid #E8C3A9;
            border-bottom: 1px solid #E8C3A9;
            padding: 20px 0;
        }

        .detail-item { display: flex; flex-direction: column; align-items: center; }
        .icon { font-size: 1.5rem; margin-bottom: 5px; color: var(--text-name-luca); }
        .label { text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; font-weight: 600; margin-bottom: 3px; }
        .value { font-size: 0.9rem; }

        /* Lugar y Enlace Mapas */
        .location { margin: 20px 0; }
        .location-label { text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .location-place { 
            font-size: 1.2rem; 
            font-weight: 600; 
            margin-top: 5px;
            color: var(--text-name-luca);
            text-decoration: none; /* Enlace */
            transition: color 0.3s;
        }
        .location-place:hover { color: var(--accent-blue); }

        /* --- BOTONES DE ACCIÓN --- */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            margin-bottom: 50px;
            position: relative;
            z-index: 20;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            color: #FFFFFF;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .btn-confirm { background-color: var(--text-name-luca); }
        .btn-questions { background-color: var(--text-name-olivia); }

        /* --- SISTEMA DE BURBUJAS (Fondo) --- */
        #bubble-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2; /* Detrás de textos y gráficos principales */
            pointer-events: none; /* No interfiere con clics */
        }

        .bubble {
            position: absolute;
            bottom: -20px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: bubbleRise 10s infinite ease-in;
            opacity: 0;
        }

        /* --- DEFINICIÓN DE ANIMACIONES CSS --- */
        
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-15px);} 60% {transform: translateY(-7px);} }
        @keyframes waveFlow { 0% { background-position-x: 0; } 100% { background-position-x: -1440px; } }
        
        /* Barco: balanceo suave */
        @keyframes shipSway { 0%, 100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-5px); } }
        
        /* Aleta: aleteo suave */
        @keyframes tailFlutter { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(3deg); } 75% { transform: rotate(-3deg); } }
        
        /* Olas fondo: movimiento sutil horizontal */
        @keyframes waveSwaySlight { from { transform: translateX(-10px); } to { transform: translateX(10px); } }

        /* Burbujas: subida con desvanecimiento */
        @keyframes bubbleRise {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-1000px) scale(1.2); opacity: 0; }
        }

        /* --- RESPONSIVE ADAPTATIONS --- */
        @media (max-width: 600px) {
            .name-luca, .name-olivia { font-size: 3.5rem; }
            .svg-ship { width: 100px; top: 220px; left: -15px; }
            .svg-mermaid-tail { width: 130px; }
            .event-details { grid-template-columns: 1fr; gap: 15px; }
            .btn { padding: 10px 20px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div id="intro-screen" onclick="activateInvitation()">
        <div class="wave-bg wave-top"></div>
        <h1>Under the Sea</h1>
        <div class="down-arrow">▼</div>
    </div>

    <div id="invitation-card">
        <div id="bubble-container"></div>

        <div class="card-content">
            
            <svg class="svg-ship" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M10,60 Q50,90 90,60 L85,80 Q50,100 15,80 Z" fill="#8B4513" stroke="#5D3A1A"/>
                <rect x="45" y="10" width="10" height="50" fill="#A0522D"/>
                <path d="M55,15 Q75,25 55,35 Z" fill="#F0F8FF" stroke="#ADD8E6"/>
                <path d="M55,35 Q75,45 55,55 Z" fill="#F0F8FF" stroke="#ADD8E6"/>
                <path d="M15,10 Q25,0 35,10 Q25,20 15,10 Z" fill="#E1AFB8" stroke="#CD8E8E"/>
                <circle cx="25" cy="10" r="2" fill="white"/>
            </svg>

            <svg class="svg-mermaid-tail" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <path d="M50,120 Q30,80 50,40 Q70,80 50,120 Z" fill="#9370DB" opacity="0.7"/>
                <path d="M50,40 Q10,-10 0,20 Q30,30 50,40 Z" fill="#E1AFB8"/>
                <path d="M50,40 Q90,-10 100,20 Q70,30 50,40 Z" fill="#E1AFB8"/>
            </svg>

            <svg class="svg-treasure" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="20" width="60" height="30" rx="5" fill="#CD853F"/>
                <path d="M10,25 Q40,5 70,25 Z" fill="#8B4513"/>
                <rect x="35" y="30" width="10" height="10" fill="#FFD700"/>
            </svg>

            <svg class="svg-waves-bottom" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path class="wave-path-blue" fill="#A7E2F2" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,213.3C960,224,1056,192,1152,176C1248,160,1344,160,1392,160L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
                <path class="wave-path-pink" fill="#E1AFB8" d="M0,224L48,218.7C96,213,192,203,288,213.3C384,224,480,256,576,261.3C672,267,768,245,864,218.7C960,192,1056,160,1152,149.3C1248,139,1344,149,1392,154.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
            </svg>

            <div class="divider-star">★</div>

            <div class="names-container">
                <h2 class="name-luca">Luca</h2>
                <span class="ampersand">&</span>
                <h2 class="name-olivia">Olivia</h2>
            </div>

            <div class="age-blocks">
                <div class="age-block age-luca">3 Años</div>
                <div class="age-star">★</div>
                <div class="age-block age-olivia">1 Año</div>
            </div>

            <div class="event-details">
                <div class="detail-item">
                    <span class="icon">📅</span>
                    <span class="label">Sábado</span>
                    <span class="value">19 de Septiembre</span>
                </div>
                <div class="detail-item">
                    <span class="icon">🕒</span>
                    <span class="label">Hora</span>
                    <span class="value">1 p.m.</span>
                </div>
                <div class="detail-item">
                    <span class="icon">📍</span>
                    <span class="label">Lugar</span>
                    <span class="value">Tikitots</span>
                </div>
            </div>

            <div class="location">
                <div class="location-label">★ Plaza Tribeca ★</div>
                <a href="https://maps.google.com/?q=Plaza+Tribeca" target="_blank" class="location-place">Ver Ubicación</a>
            </div>

            <div class="divider-star">★</div>

            <div class="action-buttons">
                <a href="https://wa.me/5219987399674?text=Hola%20AIRELA%0AConfirmo%20mi%20asistencia%20al%20evento%20%22Under%20The%20Sea%22%0AMi%20nombre%20es%3A" target="_blank" class="btn btn-confirm">
                    <span>💬</span> Confirma Asistencia
                </a>
                <a href="https://wa.me/5219987399674?text=Hola%20AIRELA%0ATengo%20preguntas%20sobre%20el%20evento%20%22Under%20The%20Sea%22" target="_blank" class="btn btn-questions">
                    <span>❓</span> Preguntas
                </a>
            </div>

        </div>
    </div>

    <script>
        // Función para activar la invitación al hacer clic en la intro
        function activateInvitation() {
            document.body.classList.add('active');
            startBubbles(); // Inicia las burbujas cuando se abre la tarjeta
        }

        // Sistema de generación automática de burbujas
        function startBubbles() {
            const container = document.getElementById('bubble-container');
            const bubbleCount = 15; // Número de burbujas simultáneas

            for (let i = 0; i < bubbleCount; i++) {
                createBubble(container);
            }

            // Crea una nueva burbuja cada segundo para mantener el flujo
            setInterval(() => createBubble(container), 1000);
        }

        function createBubble(container) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');

            // Propiedades aleatorias para cada burbuja
            const size = Math.random() * 15 + 5 + 'px'; // Entre 5px y 20px
            const left = Math.random() * 100 + '%'; // Posición horizontal aleatoria
            const delay = Math.random() * 5 + 's'; // Retraso de animación aleatorio
            const duration = Math.random() * 5 + 7 + 's'; // Duración (velocidad) aleatoria

            bubble.style.width = size;
            bubble.style.height = size;
            bubble.style.left = left;
            bubble.style.animationDelay = delay;
            bubble.style.animationDuration = duration;

            container.appendChild(bubble);

            // Elimina la burbuja después de que termine la animación para no sobrecargar
            setTimeout(() => {
                bubble.remove();
            }, (parseFloat(delay) + parseFloat(duration)) * 1000);
        }
    </script>
</body>
</html>
