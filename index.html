<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Under The Sea | Luca & Olivia</title>
  <meta name="description" content="Invitación Under The Sea — Luca & Olivia" />

  <!-- Portada al compartir el enlace -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="UNDER THE SEA | Luca & Olivia" />
  <meta property="og:description" content="Te invitamos a celebrar con Luca & Olivia" />
  <meta property="og:image" content="portada-link.jpg" />
  <meta property="og:image:alt" content="Under The Sea — Luca & Olivia" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="UNDER THE SEA | Luca & Olivia" />
  <meta name="twitter:description" content="Te invitamos a celebrar con Luca & Olivia" />
  <meta name="twitter:image" content="portada-link.jpg" />

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #d9f2fb;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* PORTADA INICIAL */
    .hero {
      position: relative;
      min-height: 100svh;
      width: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        linear-gradient(rgba(0,0,0,.03), rgba(0,0,0,.03)),
        url("portada-mar.jpg") center center / cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,.05),
        rgba(255,255,255,.02)
      );
      pointer-events: none;
    }

    .hero-title {
      position: relative;
      z-index: 3;
      color: #fff;
      letter-spacing: .28em;
      font-size: clamp(28px, 6vw, 64px);
      font-weight: 400;
      text-align: center;
      text-shadow: 0 2px 14px rgba(70,140,170,.22);
      padding-left: .28em;
      margin: 0;
    }

    .scroll-cue {
      position: absolute;
      z-index: 4;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.92);
      font-size: 28px;
      animation: floatArrow 1.6s ease-in-out infinite;
      user-select: none;
    }

    @keyframes floatArrow {
      0%,100% { transform: translate(-50%, 0); opacity: .55; }
      50% { transform: translate(-50%, 10px); opacity: 1; }
    }

    /* BURBUJAS */
    .bubbles {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      border: 1.5px solid rgba(255,255,255,.75);
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%,
          rgba(255,255,255,.75) 0 7%,
          rgba(255,255,255,.18) 15%,
          rgba(255,255,255,.06) 45%,
          rgba(255,255,255,.16) 70%,
          rgba(255,255,255,.02) 100%);
      box-shadow:
        inset 0 0 12px rgba(255,255,255,.35),
        0 0 10px rgba(255,255,255,.14);
      animation: rise linear forwards;
      opacity: 0;
    }

    @keyframes rise {
      0%   { transform: translateY(0) scale(.85); opacity: 0; }
      12%  { opacity: .8; }
      100% { transform: translateY(-120vh) scale(1.12); opacity: 0; }
    }

    /* INVITACIÓN */
    .invitation-section {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #f8efe9;
    }

    .invitation-wrap {
      position: relative;
      width: min(100%, 1102px);
      margin: 0 auto;
      line-height: 0;
    }

    .invitation-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ZONAS CLICABLES SOBRE LA IMAGEN */
    .hotspot {
      position: absolute;
      z-index: 6;
      display: block;
      border-radius: 999px;
      cursor: pointer;
      background: rgba(255,255,255,0);
      -webkit-tap-highlight-color: transparent;
    }

    /* Ajustadas a la invitación vertical */
    .map-link {
      left: 34%;
      top: 81.5%;
      width: 32%;
      height: 5.8%;
    }

    .rsvp-link {
      left: 27.5%;
      top: 91.0%;
      width: 27%;
      height: 5.6%;
    }

    .questions-link {
      left: 55%;
      top: 91.0%;
      width: 19%;
      height: 5.6%;
    }

    /* Accesibilidad: muestra un borde solo al navegar con teclado */
    .hotspot:focus-visible {
      outline: 3px solid rgba(255,255,255,.95);
      outline-offset: 2px;
    }

    @media (max-width: 600px) {
      .hero-title {
        letter-spacing: .20em;
        padding-left: .20em;
      }

      .scroll-cue {
        bottom: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <section class="hero" id="inicio">
    <h1 class="hero-title">UNDER THE SEA</h1>
    <div class="scroll-cue" aria-hidden="true">⌄</div>
  </section>

  <section class="invitation-section" id="invitacion">
    <div class="invitation-wrap">
      <img
        src="invitacion.jpg"
        alt="Invitación Under The Sea de Luca y Olivia"
      />

      <!-- PLAZA TRIBECA -->
      <a
        class="hotspot map-link"
        href="https://maps.app.goo.gl/8p8QFPSe8oT6XA1M9"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir ubicación de Plaza Tribeca en Google Maps"
      ></a>

      <!-- CONFIRMAR ASISTENCIA -->
      <a
        class="hotspot rsvp-link"
        href="https://wa.me/529987399674?text=Hola%20AIRELA%0AConfirmo%20mi%20asistencia%20al%20evento%20%22Under%20The%20Sea%22%0AMi%20nombre%20es%3A"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Confirmar asistencia por WhatsApp"
      ></a>

      <!-- PREGUNTAS -->
      <a
        class="hotspot questions-link"
        href="https://wa.me/529987399674?text=Hola%20AIRELA%0ATengo%20preguntas%20sobre%20el%20evento%20%22Under%20The%20Sea%22"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Enviar preguntas por WhatsApp"
      ></a>
    </div>
  </section>

  <script>
    const bubbleLayer = document.getElementById("bubbles");
    let bubblesStarted = false;
    let bubbleTimer = null;

    function createBubble() {
      const bubble = document.createElement("span");
      bubble.className = "bubble";

      const size = Math.random() * 34 + 10;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${Math.random() * 100}%`;
      bubble.style.animationDuration = `${Math.random() * 4 + 5}s`;

      bubbleLayer.appendChild(bubble);

      setTimeout(() => bubble.remove(), 9500);
    }

    function startBubbles() {
      if (bubblesStarted) return;
      bubblesStarted = true;

      for (let i = 0; i < 8; i++) {
        setTimeout(createBubble, i * 150);
      }

      bubbleTimer = setInterval(createBubble, 430);
    }

    function stopBubblesLater() {
      setTimeout(() => {
        if (bubbleTimer) {
          clearInterval(bubbleTimer);
          bubbleTimer = null;
        }
      }, 9000);
    }

    window.addEventListener("scroll", () => {
      if (window.scrollY > 20) {
        startBubbles();
        stopBubblesLater();
      }
    }, { passive: true });

    window.addEventListener("touchmove", () => {
      startBubbles();
      stopBubblesLater();
    }, { passive: true });
  </script>
</body>
</html>
