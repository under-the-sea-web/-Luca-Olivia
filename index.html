<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Under The Sea | Luca & Olivia</title>

  <meta
    name="description"
    content="Under The Sea - Luca & Olivia"
  >

  <meta
    name="theme-color"
    content="#b9e4ef"
  >


  <!-- ========================================
       PORTADA DEL LINK
       ======================================== -->

  <meta
    property="og:title"
    content="Under The Sea | Luca & Olivia"
  >

  <meta
    property="og:description"
    content="Te esperamos para celebrar con nosotros."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://TU-USUARIO.github.io/under-the-sea/"
  >

  <meta
    property="og:image"
    content="https://TU-USUARIO.github.io/under-the-sea/portada-link.jpg"
  >



  <style>

    /* ======================================
       GENERAL
       ====================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #bce5ef;
    }

    body {
      width: 100%;
      margin: 0;
      overflow-x: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #fff9f3;
    }

    img {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }



    /* ======================================
       PORTADA DEL OCÉANO
       ====================================== */

    .ocean-cover {

      position: relative;

      width: 100%;

      height: 100svh;

      min-height: 620px;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      background-image:
        url("fondo-oceano.jpg");

      background-size: cover;

      background-position: center center;

      background-repeat: no-repeat;

    }


    .ocean-cover::after {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 1;

      pointer-events: none;

      background:

        linear-gradient(
          to bottom,
          rgba(255,255,255,.02),
          rgba(126,205,227,.04)
        );

    }



    /* ======================================
       UNDER THE SEA
       ====================================== */

    .ocean-center {

      position: relative;

      z-index: 10;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      transform: translateY(5vh);

    }


    .ocean-title {

      color:
        rgba(
          255,
          255,
          255,
          .97
        );

      font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size:
        clamp(
          20px,
          5vw,
          31px
        );

      font-weight: 300;

      letter-spacing:
        clamp(
          6px,
          2vw,
          13px
        );

      margin-left: .5em;

      text-shadow:
        0
        2px
        15px
        rgba(
          73,
          138,
          164,
          .12
        );

    }



    /* ======================================
       FLECHA

       YA NO HAY ONDA
       ====================================== */

    .scroll-button {

      margin-top: 48px;

      width: 58px;

      height: 58px;

      display: flex;

      justify-content: center;

      align-items: center;

      border-radius: 50%;

      border:
        1.4px
        solid
        rgba(
          255,
          255,
          255,
          .88
        );

      background:
        rgba(
          255,
          255,
          255,
          .06
        );

      color: white;

      font-size: 31px;

      font-weight: 200;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

      backdrop-filter:
        blur(3px);

      -webkit-backdrop-filter:
        blur(3px);

      animation:
        arrowMove
        2.1s
        ease-in-out
        infinite;

    }


    @keyframes arrowMove {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(8px);
      }

    }



    /* ======================================
       BURBUJAS
       ====================================== */

    .bubble {

      position: absolute;

      z-index: 6;

      bottom: -60px;

      left:
        var(--left);

      width:
        var(--size);

      height:
        var(--size);

      border-radius: 50%;

      opacity: 0;

      pointer-events: none;

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          .62
        );

      background:

        radial-gradient(
          circle at 30% 26%,

          rgba(
            255,
            255,
            255,
            .92
          ),

          rgba(
            255,
            255,
            255,
            .17
          ) 27%,

          rgba(
            184,
            224,
            241,
            .10
          ) 60%,

          rgba(
            255,
            255,
            255,
            .32
          )
        );

      animation:

        bubbleRise
        var(--duration)
        linear
        var(--delay)
        infinite;

    }


    @keyframes bubbleRise {

      0% {

        opacity: 0;

        transform:
          translateY(0)
          translateX(0)
          scale(.75);

      }


      12% {
        opacity: .5;
      }


      50% {

        transform:
          translateY(-55vh)
          translateX(var(--drift))
          scale(1);

      }


      90% {
        opacity: .35;
      }


      100% {

        opacity: 0;

        transform:
          translateY(-115vh)
          translateX(
            calc(
              var(--drift) * -.25
            )
          )
          scale(1.07);

      }

    }



    /* ======================================
       SECCIÓN INVITACIÓN
       ====================================== */

    .invitation-section {

      position: relative;

      width: 100%;

      min-height: 100svh;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      background:
        #fff9f3;

      overflow: hidden;

    }



    /* ======================================
       INVITACIÓN

       PROPORCIÓN ORIGINAL 2:3
       ====================================== */

    .invitation {

      position: relative;

      width:
        min(
          100vw,
          760px
        );

      aspect-ratio:
        2 / 3;

      overflow: hidden;

      isolation: isolate;

      background:

        linear-gradient(
          145deg,
          #fffaf5 0%,
          #fcf2e9 100%
        );

    }



    /* fondo perlado */

    .invitation::before {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 0;

      pointer-events: none;

      background:

        radial-gradient(
          circle at 50% 20%,
          rgba(255,255,255,.8),
          transparent 45%
        ),

        radial-gradient(
          circle at 80% 72%,
          rgba(248,224,226,.22),
          transparent 38%
        );

    }



    /* ======================================
       PIRATA
       ====================================== */

    .pirate-zone {

      position: absolute;

      z-index: 1;

      inset: 0;

      pointer-events: none;

      overflow: hidden;

      /*
       Forma permitida para el pirata:

       - estrecho arriba
       - más espacio en la parte inferior
       - nunca invade el centro del texto
      */

      clip-path:

        polygon(
          0 0,
          20% 0,
          20% 43%,
          24% 43%,
          24% 67%,
          34% 67%,
          34% 100%,
          0 100%
        );

    }


    .pirate {

      position: absolute;

      width: 59%;

      max-width: none;

      height: auto;

      left: -8%;

      bottom: -1%;

      transform-origin:
        40%
        72%;

      animation:
        pirateMove
        6s
        ease-in-out
        infinite;

    }


    @keyframes pirateMove {

      0%,
      100% {

        transform:
          translateY(1px)
          rotate(-.28deg);

      }

      50% {

        transform:
          translateY(-4px)
          rotate(.38deg);

      }

    }



    /* ======================================
       SIRENA
       ====================================== */

    .mermaid-zone {

      position: absolute;

      z-index: 1;

      inset: 0;

      pointer-events: none;

      overflow: hidden;

      /*
       Misma protección,
       pero del lado derecho
      */

      clip-path:

        polygon(
          80% 0,
          100% 0,
          100% 100%,
          66% 100%,
          66% 67%,
          76% 67%,
          76% 43%,
          80% 43%
        );

    }


    .mermaid {

      position: absolute;

      width: 58%;

      max-width: none;

      height: auto;

      right: -8%;

      bottom: -1%;

      transform-origin:
        62%
        70%;

      animation:
        mermaidMove
        6.5s
        ease-in-out
        infinite;

    }


    @keyframes mermaidMove {

      0%,
      100% {

        transform:
          translateY(1px)
          rotate(.15deg);

      }

      50% {

        transform:
          translateY(-4px)
          rotate(-.28deg);

      }

    }



    /* ======================================
       BURBUJAS DE INVITACIÓN
       ====================================== */

    #invitationBubbles {

      position: absolute;

      inset: 0;

      z-index: 2;

      pointer-events: none;

      overflow: hidden;

    }



    /* ======================================
       PROTECCIÓN DE TEXTO

       Es prácticamente invisible,
       pero evita que cualquier detalle
       de las ilustraciones aparezca detrás
       de las letras.
       ====================================== */

    .text-protection {

      position: absolute;

      z-index: 3;

      top: 6%;

      bottom: 8%;

      left: 16%;

      right: 16%;

      pointer-events: none;

      background:

        linear-gradient(
          90deg,

          rgba(
            255,
            250,
            245,
            0
          ) 0%,

          rgba(
            255,
            250,
            245,
            .88
          ) 8%,

          rgba(
            255,
            250,
            245,
            .98
          ) 17%,

          rgba(
            255,
            250,
            245,
            .99
          ) 83%,

          rgba(
            255,
            250,
            245,
            .88
          ) 92%,

          rgba(
            255,
            250,
            245,
            0
          ) 100%
        );

    }



    /* ======================================
       INFORMACIÓN

       AHORA SE VE GRANDE EN CELULAR
       ====================================== */

    .information-layer {

      position: absolute;

      z-index: 10;

      inset: 0;

      display: flex;

      justify-content: center;

      align-items: center;

      pointer-events: none;

    }


    .information-layer img {

      width: 100%;

      height: 100%;

      object-fit: contain;

    }



    /* ======================================
       ZONAS CLICABLES
       ====================================== */

    .click-area {

      position: absolute;

      z-index: 30;

      display: block;

      background:
        transparent;

      cursor: pointer;

      border: 0;

      text-decoration: none;

      -webkit-tap-highlight-color:
        transparent;

    }



    /* Google Maps */

    .map-area {

      left: 26%;

      top: 76%;

      width: 48%;

      height: 7%;

    }



    /* Confirmar asistencia */

    .confirm-area {

      left: 5%;

      top: 88%;

      width: 47%;

      height: 8%;

      border-radius: 100px;

    }



    /* Preguntas */

    .questions-area {

      right: 5%;

      top: 88%;

      width: 42%;

      height: 8%;

      border-radius: 100px;

    }



    .click-area:active {

      background:
        rgba(
          255,
          255,
          255,
          .06
        );

      transform:
        scale(.99);

    }



    /* ======================================
       IPHONE / CELULAR
       ====================================== */

    @media
    (max-width: 600px) {

      .invitation-section {

        padding: 0;

        min-height: auto;

      }


      .invitation {

        width: 100vw;

        /*
         MUY IMPORTANTE:
         recuperamos el formato vertical
         del diseño original.
        */

        aspect-ratio:
          2 / 3;

      }


      /*
       La información NO vuelve a hacerse
       pequeña. Ocupa todo el canvas.
      */

      .information-layer {

        inset: 0;

      }


      .information-layer img {

        width: 100%;

        height: 100%;

      }



      /*
       Ajustamos un poco los elementos
       para iPhone.
      */

      .pirate {

        width: 61%;

        left: -10%;

        bottom: -1%;

      }


      .mermaid {

        width: 60%;

        right: -10%;

        bottom: -1%;

      }



      /*
       En celular protegemos todavía
       un poco más las letras.
      */

      .pirate-zone {

        clip-path:

          polygon(
            0 0,
            18% 0,
            18% 43%,
            22% 43%,
            22% 67%,
            31% 67%,
            31% 100%,
            0 100%
          );

      }


      .mermaid-zone {

        clip-path:

          polygon(
            82% 0,
            100% 0,
            100% 100%,
            69% 100%,
            69% 67%,
            78% 67%,
            78% 43%,
            82% 43%
          );

      }


      .text-protection {

        left: 14%;

        right: 14%;

      }


      .ocean-center {

        transform:
          translateY(2vh);

      }


      .ocean-title {

        font-size: 19px;

        letter-spacing: 6px;

      }


      .scroll-button {

        margin-top: 45px;

        width: 55px;

        height: 55px;

      }

    }



    /* ======================================
       COMPUTADORA
       ====================================== */

    @media
    (min-width: 800px) {

      .invitation-section {

        padding:
          45px
          0
          70px;

      }


      .invitation {

        width:
          min(
            62vw,
            760px
          );

        border-radius: 5px;

        box-shadow:

          0
          22px
          70px
          rgba(
            112,
            89,
            72,
            .08
          );

      }

    }



    /* ======================================
       ACCESIBILIDAD
       ====================================== */

    @media
    (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {

        animation-duration:
          .001ms !important;

        animation-iteration-count:
          1 !important;

      }

    }

  </style>

</head>



<body>


  <!-- ======================================
       PANTALLA 1
       ====================================== -->

  <section
    class="ocean-cover"
    id="ocean"
  >


    <div id="oceanBubbles"></div>


    <div class="ocean-center">


      <h1 class="ocean-title">
        UNDER THE SEA
      </h1>


      <!--
        YA NO EXISTE LA ONDA.
        SOLO QUEDA LA FLECHA.
      -->


      <button

        class="scroll-button"

        id="scrollButton"

        aria-label="Ver invitación"

      >

        ↓

      </button>


    </div>


  </section>




  <!-- ======================================
       PANTALLA 2
       ====================================== -->

  <section

    class="invitation-section"

    id="invitationSection"

  >


    <div class="invitation">



      <!-- PIRATA -->

      <div class="pirate-zone">


        <img

          src="pirata.png"

          class="pirate"

          alt=""

        >


      </div>



      <!-- SIRENA -->

      <div class="mermaid-zone">


        <img

          src="sirena.png"

          class="mermaid"

          alt=""

        >


      </div>



      <!-- BURBUJAS -->

      <div id="invitationBubbles"></div>



      <!-- PROTECCIÓN -->

      <div class="text-protection"></div>



      <!-- INFORMACIÓN -->

      <div class="information-layer">


        <img

          src="contenido-invitacion.png"

          alt="Invitación Under The Sea de Luca y Olivia"

        >


      </div>




      <!-- ====================================
           GOOGLE MAPS
           ==================================== -->

      <a

        class="click-area map-area"

        href="https://maps.app.goo.gl/qPQYuWRUw7UVQDpi6?g_st=ic"

        target="_blank"

        rel="noopener noreferrer"

        aria-label="Abrir Plaza Tribeca en Google Maps"

      ></a>




      <!-- ====================================
           CONFIRMA ASISTENCIA
           ==================================== -->

      <a

        class="click-area confirm-area"

        id="confirmButton"

        href="#"

        aria-label="Confirmar asistencia por WhatsApp"

      ></a>




      <!-- ====================================
           PREGUNTAS
           ==================================== -->

      <a

        class="click-area questions-area"

        id="questionsButton"

        href="#"

        aria-label="Enviar preguntas por WhatsApp"

      ></a>


    </div>


  </section>




  <script>


    /* ======================================
       WHATSAPP
       ====================================== */

    const whatsappNumber =
      "529987399674";


    const confirmMessage =
`Hola Airela
Confirmo mi asistencia al evento “Under The Sea”
Mi nombre es:`;


    const questionsMessage =
`Hola AIRELA
Tengo preguntas sobre el evento “Under The Sea”`;



    /* CONFIRMAR */

    document
      .getElementById("confirmButton")
      .addEventListener(
        "click",
        function(event) {

          event.preventDefault();

          const url =
            "https://wa.me/"
            +
            whatsappNumber
            +
            "?text="
            +
            encodeURIComponent(
              confirmMessage
            );

          window.open(
            url,
            "_blank"
          );

        }
      );



    /* PREGUNTAS */

    document
      .getElementById("questionsButton")
      .addEventListener(
        "click",
        function(event) {

          event.preventDefault();

          const url =
            "https://wa.me/"
            +
            whatsappNumber
            +
            "?text="
            +
            encodeURIComponent(
              questionsMessage
            );

          window.open(
            url,
            "_blank"
          );

        }
      );



    /* ======================================
       FLECHA
       ====================================== */

    document
      .getElementById("scrollButton")
      .addEventListener(
        "click",
        function() {

          document
            .getElementById(
              "invitationSection"
            )
            .scrollIntoView({

              behavior:
                "smooth",

              block:
                "start"

            });

        }
      );



    /* ======================================
       BURBUJAS
       ====================================== */

    function createBubbles(
      containerId,
      quantity
    ) {


      const container =
        document.getElementById(
          containerId
        );


      for (
        let i = 0;
        i < quantity;
        i++
      ) {


        const bubble =
          document.createElement(
            "span"
          );


        bubble.classList.add(
          "bubble"
        );


        const size =
          Math.random() * 24 + 7;


        const left =
          Math.random() * 96;


        const duration =
          Math.random() * 8 + 9;


        const delay =
          Math.random() * -18;


        const drift =
          Math.random() * 42 - 21;



        bubble.style.setProperty(
          "--size",
          size + "px"
        );


        bubble.style.setProperty(
          "--left",
          left + "%"
        );


        bubble.style.setProperty(
          "--duration",
          duration + "s"
        );


        bubble.style.setProperty(
          "--delay",
          delay + "s"
        );


        bubble.style.setProperty(
          "--drift",
          drift + "px"
        );


        container.appendChild(
          bubble
        );

      }

    }


    createBubbles(
      "oceanBubbles",
      18
    );


    createBubbles(
      "invitationBubbles",
      13
    );


  </script>


</body>

</html>
