<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Under The Sea - Luca & Olivia</title>

  <!-- Meta tags para la portada al compartir el link -->
  <meta property="og:title" content="Invitación Under The Sea - Luca & Olivia">
  <meta property="og:description" content="¡Acompáñanos a celebrar el cumpleaños de Luca & Olivia!">
  <meta property="og:image" content="https://under-the-sea-web.github.io/-Luca-Olivia/portada.png">
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f3ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    .invitation-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow: hidden;
      border-radius: 12px;
      background-color: #ffffff;
      perspective: 1000px;
    }

    .invitation-img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.1s ease-out;
    }

    /* EFECTOS DE MOVIMIENTO DE CAPAS */
    .motion-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Animación sutil de balanceo para simular barco/ola/sirena */
    .sway-boat {
      animation: boatSway 4s ease-in-out infinite alternate;
      transform-origin: 15% 70%;
    }

    .sway-tail {
      animation: tailSway 3s ease-in-out infinite alternate;
      transform-origin: 85% 60%;
    }

    @keyframes boatSway {
      0% { transform: rotate(-1.5deg) translateY(0px); }
      100% { transform: rotate(1.5deg) translateY(-3px); }
    }

    @keyframes tailSway {
      0% { transform: rotate(-2deg) scaleX(0.98); }
      100% { transform: rotate(2deg) scaleX(1.02); }
    }

    /* BURBUJAS */
    .bubbles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .bubble {
      position: absolute;
      bottom: -20px;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.6);
      animation: rise 6s ease-in infinite;
    }

    @keyframes rise {
      0% {
        bottom: -20px;
        transform: translateX(0) scale(0.5);
        opacity: 0;
      }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% {
        bottom: 105%;
        transform: translateX(25px) scale(1.2);
        opacity: 0;
      }
    }

    /* BOTONES INTERACTIVOS */
    .clickable-area {
      position: absolute;
      cursor: pointer;
      z-index: 20;
    }

    /* Ubicación Plaza Tribeca */
    .location-btn {
      top: 82%;
      left: 30%;
      width: 40%;
      height: 4%;
    }

    /* Confirmar Asistencia */
    .rsvp-btn {
      top: 91.5%;
      left: 27.5%;
      width: 24.5%;
      height: 4.5%;
      border-radius: 20px;
    }

    /* Preguntas */
    .questions-btn {
      top: 91.5%;
      left: 54.5%;
      width: 18%;
      height: 4.5%;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="invitation-container" id="card">
    <img src="invitacion.png" alt="Invitación Under The Sea" class="invitation-img" id="mainImg">

    <div class="bubbles-container" id="bubblesContainer"></div>

    <!-- Enlaces interactivos -->
    <a href="https://maps.app.goo.gl/Zn2ipgjLzvojkB1x9" target="_blank" class="clickable-area location-btn" title="Ver ubicación en Plaza Tribeca"></a>
    <a id="rsvpLink" class="clickable-area rsvp-btn" target="_blank" title="Confirmar asistencia por WhatsApp"></a>
    <a id="questionsLink" class="clickable-area questions-btn" target="_blank" title="Hacer preguntas por WhatsApp"></a>
  </div>

  <script>
    // Configuración WhatsApp
    const phone = "5219987399674";
    const textRSVP = "Hola AIRELA ✨\nConfirmo mi asistencia\nMi nombre es:";
    const textQuestions = "Hola AIRELA ✨\nTengo preguntas sobre el evento \"Under The Sea\"";

    document.getElementById("rsvpLink").href = `https://wa.me/${phone}?text=${encodeURIComponent(textRSVP)}`;
    document.getElementById("questionsLink").href = `https://wa.me/${phone}?text=${encodeURIComponent(textQuestions)}`;

    // Generador de burbujas
    function createBubbles() {
      const container = document.getElementById("bubblesContainer");
      const bubbleCount = 18;

      for (let i = 0; i < bubbleCount; i++) {
        const bubble = document.createElement("div");
        bubble.classList.add("bubble");

        const size = Math.random() * 16 + 8;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.random() * 90 + 5}%`;
        bubble.style.animationDelay = `${Math.random() * 4}s`;
        bubble.style.animationDuration = `${Math.random() * 3 + 4}s`;

        container.appendChild(bubble);
      }
    }

    // Respuesta a la inclinación del celular (Giroscopio / Parallax)
    function handleOrientation(event) {
      const img = document.getElementById("mainImg");
      const gamma = event.gamma; // Inclinación izquierda/derecha [-90, 90]
      const beta = event.beta;   // Inclinación frente/atrás [-180, 180]

      if (gamma !== null && beta !== null) {
        const moveX = Math.min(Math.max(gamma / 4, -10), 10);
        const moveY = Math.min(Math.max((beta - 45) / 4, -10), 10);
        img.style.transform = `scale(1.03) translate(${moveX}px, ${moveY}px)`;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      createBubbles();
      if (window.DeviceOrientationEvent) {
        window.addEventListener("deviceorientation", handleOrientation, true);
      }
    });
  </script>
</body>
</html>
